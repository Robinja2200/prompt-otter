name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to validate, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CHROME_EXTENSION_ID: bpnjpbkbmnjfcpiencjcinegcjfeiplc
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate release version
        run: npm run validate:release -- "$RELEASE_TAG"

      - name: Build release artifacts
        run: npm run build -- "$RELEASE_TAG"

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Submit Firefox Add-ons listed update
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        run: npm run sign:firefox

      - name: Publish Chrome Web Store update
        if: ${{ env.CHROME_CLIENT_ID != '' && env.CHROME_CLIENT_SECRET != '' && env.CHROME_REFRESH_TOKEN != '' && env.CHROME_PUBLISHER_ID != '' }}
        run: npm run publish:chrome

      - name: Collect Firefox signed artifacts
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        run: find artifacts/firefox -maxdepth 1 -type f -print -exec cp {} artifacts/ \;

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prompt-otter-${{ env.RELEASE_TAG }}
          path: artifacts/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Prompt Otter $RELEASE_TAG"
          find artifacts -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
